<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="honey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#e8a11c"/>
    </linearGradient>
  </defs>

  <!-- fundo escuro de marca -->
  <rect width="512" height="512" fill="#1a1d24"/>

  <!-- favo hexagonal central (símbolo Beedero) -->
  <polygon points="256,96 394,176 394,336 256,416 118,336 118,176"
           fill="url(#honey)"/>

  <!-- abelha estilizada dentro do favo: corpo com riscas -->
  <g transform="translate(256,256)">
    <!-- corpo -->
    <ellipse cx="0" cy="14" rx="56" ry="70" fill="#1a1d24"/>
    <!-- riscas (recortes na cor do favo) -->
    <rect x="-56" y="-14" width="112" height="16" rx="8" fill="#f5c542"/>
    <rect x="-56" y="20" width="112" height="16" rx="8" fill="#f5c542"/>
    <rect x="-56" y="54" width="112" height="14" rx="7" fill="#f5c542"/>
    <!-- cabeça -->
    <circle cx="0" cy="-64" r="26" fill="#1a1d24"/>
    <!-- asas -->
    <ellipse cx="-46" cy="-34" rx="30" ry="20" fill="#1a1d24" opacity="0.55" transform="rotate(-28 -46 -34)"/>
    <ellipse cx="46" cy="-34" rx="30" ry="20" fill="#1a1d24" opacity="0.55" transform="rotate(28 46 -34)"/>
    <!-- antenas -->
    <path d="M-10,-84 Q-22,-104 -34,-104" stroke="#1a1d24" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M10,-84 Q22,-104 34,-104" stroke="#1a1d24" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
