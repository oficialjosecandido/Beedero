name: Daily billing reminders

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run billing_reminders
        run: |
          curl -fsS -X POST "${{ secrets.BEEDERO_API_URL }}/api/internal/run-job/" \
            -H "X-Management-Secret: ${{ secrets.MANAGEMENT_SECRET }}" \
            -H "X-Management-Job: billing_reminders"
