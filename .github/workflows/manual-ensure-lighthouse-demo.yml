name: Ensure Lighthouse demo fixtures

# Seeds /p/lighthouse-demo and /o/lighthouse-demo on production.
# Prefer auditing the static /lighthouse-demo dashboard (no seed required).
# Run after deploy if the seeded URLs still 404 (Azure may not restart, or
# startup.sh may not have been the App Service command).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run ensure_lighthouse_demo_person
        run: |
          curl -fsS -X POST "${{ secrets.BEEDERO_API_URL }}/api/internal/run-job/" \
            -H "X-Management-Secret: ${{ secrets.MANAGEMENT_SECRET }}" \
            -H "X-Management-Job: ensure_lighthouse_demo_person"
