name: Weekly prune profile views

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run prune_profile_views
        run: |
          curl -fsS -X POST "${{ secrets.BEEDERO_API_URL }}/api/internal/run-job/" \
            -H "X-Management-Secret: ${{ secrets.MANAGEMENT_SECRET }}" \
            -H "X-Management-Job: prune_profile_views"
