name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beedero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/beedero_test
      DJANGO_SECRET_KEY: ci-test-secret-key
      # Not real credentials — settings.py requires these to be present (no
      # SMTP/local-disk fallback), but no test exercises Azure over the wire.
      AZURE_ACCOUNT_NAME: citest
      AZURE_ACCOUNT_KEY: ci-test-key
      AZURE_COMMUNICATION_CONNECTION_STRING: endpoint=https://ci-test.communication.azure.com/;accesskey=ci-test-key
      DEFAULT_FROM_EMAIL: DoNotReply@ci-test.azurecomm.net

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend test suite
        run: pytest
