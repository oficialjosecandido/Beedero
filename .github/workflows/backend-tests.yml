name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beedero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/beedero_test
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "true"
      FRONTEND_URL: http://localhost:3000
      # Not real credentials — settings.py requires these to be present (no
      # SMTP/local-disk fallback), but no test exercises Azure over the wire.
      AZURE_ACCOUNT_NAME: citest
      AZURE_ACCOUNT_KEY: ci-test-key
      AZURE_COMMUNICATION_CONNECTION_STRING: endpoint=https://ci-test.communication.azure.com/;accesskey=ci-test-key
      BEEDERO_APP_DB_PASSWORD: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # RLS (docs/rls_postgres.sql) only bites when the app connects as an
      # unprivileged role — table owners/superusers bypass it even with
      # FORCE ROW LEVEL SECURITY. `beedero_app` is a Postgres role (cluster-
      # wide, not per-database) so this only needs to run once; conftest.py's
      # `_grant_app_role_on_test_db` fixture grants it privileges on the
      # per-test-run database afterward. Without this step, every test using
      # the `db_app_role_connection` fixture (P0.4's RLS proof test) fails
      # with "role beedero_app does not exist".
      - name: Create beedero_app DB role
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE beedero_app LOGIN PASSWORD 'test';"

      - name: Create cache table
        run: python manage.py createcachetable

      - name: Lint
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Run backend test suite
        run: pytest
